<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Train Ramp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e5f6fd;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .status {
            background-color: #e6f7ff;
            padding: 20px;
            font-size: 22px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .marquee {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: scroll 20s linear infinite;
        }

        @keyframes scroll {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        .main-status {
            margin: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .down {
            background-color: #ff6666;
            color: white;
        }

        .up {
            background-color: #66cc66;
            color: white;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            font-size: 18px;
        }

        .info-panel h3 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .info-panel .status-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .info-panel .status-row span {
            margin-left: 10px;
            font-size: 18px;
        }

        .info-panel .status-row .dot {
            margin-left: 20px;
        }

        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .dot.red {
            background-color: red;
        }

        .dot.green {
            background-color: green;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="status">
        <div class="marquee">
            <span id="status-info">Rampa je spuštena. Crvena LED svijetli. Buzzer je upaljen.</span>
        </div>
    </div>

    <div class="main-status" id="main-status">Rampa je spuštena.</div>

    <div class="buttons">
        <button class="down" onclick="lowerRamp()">SPUSTI RAMPU</button>
        <button class="up" onclick="raiseRamp()">PODIGNI RAMPU</button>
    </div>

    <div class="info-panel" id="info-panel">
        <h3>Statusne informacije</h3>
        <div class="status-row">
            <strong>Rampa:</strong>
            <span id="ramp-status">dolje</span>
        </div>
        <div class="status-row">
            <strong>LED:</strong>
            <div id="led-status" class="dot red"></div>
        </div>
        <div class="status-row">
            <strong>Buzzer:</strong>
            <span id="buzzer-status" class="icon">🔊</span>
        </div>
    </div>

    <script>
        let statusInfo = document.getElementById("status-info");
        let mainStatus = document.getElementById("main-status");
        let marquee = document.querySelector(".marquee span");
        let rampStatus = document.getElementById("ramp-status");
        let ledStatus = document.getElementById("led-status");
        let buzzerStatus = document.getElementById("buzzer-status");

        function updateMarqueeTextBasedOnStatus() {
            if (mainStatus.textContent === "Rampa je spuštena.") {
                marquee.textContent = "Rampa je spuštena. Crvena LED svijetli. Buzzer je upaljen.";
                rampStatus.textContent = "dolje";
                ledStatus.className = "dot red";
                buzzerStatus.textContent = "🔊";
            } else if (mainStatus.textContent === "Rampa je podignuta.") {
                marquee.textContent = "Rampa je podignuta. Zelena LED svijetli. Buzzer je ugašen.";
                rampStatus.textContent = "gore";
                ledStatus.className = "dot green";
                buzzerStatus.textContent = "🔇";
            }
        }

        function lowerRamp() {
            mainStatus.textContent = "Rampa je spuštena.";
            updateMarqueeTextBasedOnStatus();
        }

        function raiseRamp() {
            mainStatus.textContent = "Rampa je podignuta.";
            updateMarqueeTextBasedOnStatus();
        }

        updateMarqueeTextBasedOnStatus();
    </script>
</body>
</html>
